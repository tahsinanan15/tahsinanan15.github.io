<!doctype html>
<html lang="en" class="js" data-theme="aero">
<head>
<meta charset="utf-8">
<title>BRING_BACK carousel</title>
<!-- One slide per load: slides.html?s=1&t=aero. Drawn at 540x675 and captured at 2x, so it lands at 1080x1350 with the site's own chrome at its real proportions. -->
<link rel="stylesheet" href="../../../css/site.css">
<style>
  html, body { width: 540px; height: 675px; margin: 0; overflow: hidden; }
  html.js body { position: relative; background: #2f8fe0 var(--wall) center/cover; }
  .slide { position: absolute; inset: 0 0 34px; display: grid; align-content: start; padding: 40px 20px 18px; }   /* same top on every slide, so the title bar doesn't jump on a swipe */
  .slide .win { position: relative; display: flex; flex-direction: column; box-shadow: var(--win-shadow-on); }
  .slide .win__bar { height: 30px; }
  .slide .win__file { font-size: 16px; }
  .slide .win__body { padding: 16px 16px 14px; }
  .slide .win__status { font-size: 13px; }
  .dots { margin-left: auto; display: flex; gap: 4px; }
  .dots i { width: 7px; height: 7px; background: rgba(255, 255, 255, .45); border-radius: 50%; }
  .dots i.on { background: #fff; }
  h1.s { margin: 0 0 8px; color: var(--heading); font: 700 34px/1.05 var(--display); letter-spacing: -.01em; text-wrap: balance; }
  h2.s { margin: 0 0 8px; color: var(--heading); font: 700 26px/1.1 var(--display); text-wrap: balance; }
  .lede { margin: 0 0 10px; color: var(--ink); font: 400 15.5px/1.45 var(--body); text-wrap: pretty; }
  .lede b { color: var(--heading); }
  .small { margin: 8px 0 0; color: var(--ink-2); font: 400 13px/1.35 var(--body); }
  .scr { padding: 8px 10px 6px; background: var(--lcd-bg); border: 1px solid #03101f; border-radius: 6px; box-shadow: inset 0 1px 4px rgba(0, 0, 0, .8); }
  .lcdrow { display: flex; justify-content: space-between; gap: 8px; color: var(--lcd-fg); font: 400 16px/20px var(--pixel); text-shadow: 0 0 6px var(--lcd-glow); }
  .lcdrow.sub { color: var(--lcd-sub); font-size: 16px; line-height: 20px; }
  .curve { display: block; width: 100%; height: auto; margin: 4px 0 2px; overflow: visible; }
  .curve .ln { fill: none; stroke: var(--lcd-fg); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; filter: drop-shadow(0 0 3px var(--lcd-glow)); }
  .curve .last { fill: color-mix(in srgb, var(--lcd-fg) 12%, transparent); }
  .curve .avg { stroke: var(--lcd-sub); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .curve text { fill: var(--lcd-sub); font: 400 8px var(--pixel); }
  .lcds { margin: 10px 0 0 !important; }
  .lcds b { font-size: 32px; }
  .lcds span { font-size: 12.5px; }
  .calls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0 0; }
  .calls div { padding: 7px 10px 6px; background: var(--tint); border-radius: 5px; }
  .calls dt { color: var(--ink-2); font-size: 13px; line-height: 1.2; }
  .calls dd { margin: 2px 0 0; color: var(--heading); font: 700 17px/1.15 var(--display); }
  .steps { display: grid; gap: 8px; margin: 10px 0 0; padding: 0; list-style: none; counter-reset: s; }
  .steps li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start; font: 400 14px/1.35 var(--body); }
  .steps li::before { counter-increment: s; content: counter(s); display: grid; width: 26px; height: 26px; place-items: center; color: var(--lcd-fg); font: 400 16px/1 var(--pixel); background: var(--lcd-bg); border-radius: 5px; }
  .gel { pointer-events: none; }
  .url { margin: 12px 0 0; color: var(--heading); font: 400 16px/1.3 var(--pixel); }
  .ci text { fill: var(--ink-2); font: 400 11px var(--body); }
  .ci .lab { fill: var(--heading); font: 700 13px var(--display); }
  .taskbar { position: absolute; height: 34px; gap: 6px; padding: 0 6px; }
  .taskbar .start { height: 26px; padding: 0 10px 0 3px; font-size: 14px; }
  .taskbar .orb { width: 21px; height: 21px; }
  .taskbar .orb svg { width: 15px; height: 15px; }
  .taskbar .who { font: 400 8px/1 var(--pixel); color: #fff; text-shadow: var(--bar-shadow); }
  .taskbar .who + .who { margin-left: auto; }
  .roomy h1.s, .roomy h2.s { font-size: 38px; margin-bottom: 14px; }
  .roomy .lede { font-size: 19px; margin-bottom: 14px; }
  .roomy .steps li { font-size: 17px; gap: 10px; }
  .roomy .steps { gap: 14px; }
  .roomy .small { font-size: 13px; }
  .roomy .url { font-size: 24px; }
  .roomy .ci text { font-size: 13px; }
  .roomy .ci .lab { font-size: 15px; }
  .pix { position: absolute; image-rendering: pixelated; pointer-events: none; }
</style>
</head>
<body>
<div id="root"></div>
<footer class="taskbar"><span class="start"><span class="orb"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M2 24C8 12 16 7 24 7s16 5 22 17c-6 12-14 17-22 17S8 36 2 24z" fill="#fff"/><circle cx="24" cy="24" r="12" fill="#0a5cb8"/><circle cx="24" cy="24" r="5.5" fill="#061a33"/><ellipse cx="20" cy="19" rx="3.5" ry="2.5" fill="#fff"/></svg></span><span id="startlab">start</span></span><span class="who">TAHSIN ANAN</span><span class="who" id="page"></span></footer>
<script type="module" src="slides.js"></script>
</body>
</html>
